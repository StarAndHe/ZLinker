name: Store Assets

on:
  workflow_dispatch:

jobs:
  play-store-assets:
    name: Upload Play Store listing assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload icon + screenshots + listing via Edit API
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install google-auth requests
          python tool/upload_play_assets.py
